name: build
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Collect
        run: |
          mkdir out
          copy build\Release\VeniceExec.exe out\
          copy build\Release\VeniceCore.dll out\
      - uses: actions/upload-artifact@v4
        with:
          name: VeniceExec-windows-x64
          path: out/*
